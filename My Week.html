<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My Week</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f2f4f3;
            --card: #fff;
            --ink: #14201f;
            --mute: #64726f;
            --line: #dde3e1;
            --acc: #0f766e;
            --accbg: #d7efeb;
            --College: #3b5bdb;
            --Work: #d9480f;
            --Study: #7048e8;
            --Gym: #2b8a3e;
            --Prayer: #0b7285;
            --Meal: #c77700;
            --Break: #868e96;
            --Commute: #868e96;
            --Sleep: #495057
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #101615;
                --card: #182120;
                --ink: #e8f0ee;
                --mute: #93a5a1;
                --line: #2a3735;
                --acc: #3ccfbf;
                --accbg: #1b3b37
            }
        }

        :root[data-theme="dark"] {
            --bg: #101615;
            --card: #182120;
            --ink: #e8f0ee;
            --mute: #93a5a1;
            --line: #2a3735;
            --acc: #3ccfbf;
            --accbg: #1b3b37
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px
        }

        .now {
            background: var(--acc);
            color: #fff;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 16px
        }

        :root[data-theme="dark"] .now,
        :root:not([data-theme="light"]) .now {
            color: #06201d
        }

        .now small {
            opacity: .8;
            font-size: 13px
        }

        .now h1 {
            margin: 2px 0 4px;
            font-size: 26px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -.01em
        }

        .now p {
            margin: 0;
            font-size: 14px;
            opacity: .9
        }

        .bar {
            height: 6px;
            background: rgba(255, 255, 255, .3);
            border-radius: 3px;
            margin-top: 12px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: currentColor;
            width: 0
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
            scrollbar-width: none
        }

        .tabs button {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 8px 14px;
            border-radius: 999px;
            font: inherit;
            font-size: 14px;
            cursor: pointer
        }

        .tabs button[aria-selected=true] {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink)
        }

        .tabs button.today::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acc);
            margin-left: 6px;
            vertical-align: middle
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 2px 10px;
            color: var(--mute);
            font-size: 14px
        }

        .head button {
            border: 0;
            background: none;
            color: var(--acc);
            font: inherit;
            cursor: pointer;
            padding: 4px
        }

        .prog {
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            margin: 0 2px 14px;
            overflow: hidden
        }

        .prog i {
            display: block;
            height: 100%;
            background: var(--acc);
            width: 0;
            transition: width .3s
        }

        .item {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) 28px 20px;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 5px solid var(--c);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px
        }

        .item.cur {
            outline: 2px solid var(--acc);
            outline-offset: 1px
        }

        .item.done .t {
            text-decoration: line-through;
            color: var(--mute)
        }

        .time {
            font-size: 13px;
            color: var(--mute);
            line-height: 1.3;
            padding-top: 2px
        }

        .t {
            font-weight: 600
        }

        .meta {
            font-size: 13px;
            color: var(--mute)
        }

        .main {
            cursor: pointer;
            min-width: 0
        }

        .det {
            display: none;
            margin-top: 6px;
            font-size: 14px;
            border-top: 1px dashed var(--line);
            padding-top: 6px
        }

        .item.open .det {
            display: block
        }

        .chk {
            width: 24px;
            height: 24px;
            accent-color: var(--acc);
            cursor: pointer;
            margin: 0
        }

        button:focus-visible,
        input:focus-visible,
        .main:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        .foot {
            text-align: center;
            color: var(--mute);
            font-size: 13px;
            margin: 18px 0 28px
        }

        .foot button {
            border: 0;
            background: none;
            color: var(--mute);
            font: inherit;
            text-decoration: underline;
            cursor: pointer
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0 14px
        }

        .action-btn {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 9px 13px;
            border-radius: 10px;
            font: inherit;
            cursor: pointer
        }

        .action-btn.primary {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }

        .panel {
            display: none;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin: 0 0 14px
        }

        .panel.show {
            display: block
        }

        .panel h2 {
            font-size: 18px;
            margin: 0 0 12px
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }

        .form-grid label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: var(--mute)
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            min-width: 0;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink);
            font: inherit;
            font-size: 14px
        }

        .form-grid textarea {
            resize: vertical
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap
        }

        .category-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line)
        }

        .category-row:last-child {
            border-bottom: 0
        }

        .swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block
        }

        .category-row .cat-name {
            flex: 1
        }

        .delete-task {
            border: 0;
            background: transparent;
            color: #c0392b;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            align-self: start
        }

        @media(max-width:480px) {
            .form-grid {
                grid-template-columns: 1fr
            }

            .item {
                grid-template-columns: 62px minmax(0, 1fr) 24px 18px;
                gap: 7px;
                padding: 9px
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="now" aria-live="polite"><small id="nl">Now</small>
            <h1 id="nt">...</h1>
            <p id="ns"></p>
            <div class="bar"><i id="nb"></i></div>
        </section>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="head"><span id="cnt"></span><button id="hide">Hide finished</button></div>
        <div class="actions"><button class="action-btn primary" id="addTaskBtn">+ Add task</button><button
                class="action-btn" id="manageCategoriesBtn">Manage categories</button></div>
        <section class="panel" id="taskPanel">
            <h2>Add a task</h2>
            <form id="taskForm">
                <div class="form-grid">
                    <label>Task name<input id="taskName" required maxlength="120"
                            placeholder="e.g. Review lecture notes"></label>
                    <label>Day<select id="taskDay"></select></label>
                    <label>Start time<input id="taskStart" type="time" required value="09:00"></label>
                    <label>End time<input id="taskEnd" type="time" required value="10:00"></label>
                    <label>Category<select id="taskCategory"></select></label>
                    <label>Location<input id="taskLocation" maxlength="120" placeholder="Home, college..."></label>
                    <label style="grid-column:1/-1">Notes / details<textarea id="taskNotes" rows="2" maxlength="600"
                            placeholder="Optional details"></textarea></label>
                </div>
                <div class="form-actions"><button class="action-btn primary" type="submit">Save task</button><button
                        class="action-btn" type="button" id="cancelTaskBtn">Cancel</button></div>
            </form>
        </section>
        <section class="panel" id="categoryPanel">
            <h2>Manage categories</h2>
            <form id="categoryForm">
                <div class="form-grid"><label>Category name<input id="categoryName" required maxlength="40"
                            placeholder="e.g. Personal"></label><label>Category color<input id="categoryColor"
                            type="color" value="#0f766e"></label></div>
                <div class="form-actions"><button class="action-btn primary" type="submit">Add category</button><button
                        class="action-btn" type="button" id="closeCategoriesBtn">Close</button></div>
            </form>
            <div id="categoryList" style="margin-top:12px"></div>
        </section>
        <div class="prog"><i id="pg"></i></div>
        <div id="list"></div>
        <div class="foot"><button id="theme">Switch theme</button> &nbsp; <button id="reset">Reset today's
                checks</button></div>
    </main>
